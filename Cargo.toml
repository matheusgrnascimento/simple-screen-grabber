[package]
name = "simple-screen-grabber"
version = "0.1.0"
edition = "2021"
description = "Native Windows screenshot tool: select an area, annotate it, save or copy it"
license = "MIT"
repository = "https://github.com/matheusgrnascimento/simple-screen-grabber"
readme = "README.md"
publish = false

[workspace]
members = ["tools/genicon"]

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
